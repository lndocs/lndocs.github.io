name: LNbits release watch

# Opens an issue when LNbits publishes a release newer than the pinned one.
# To bump: change scripts/lnbits-version.txt, run the gate and claims, fix the pages, merge.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pinned version with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PINNED=$(cat scripts/lnbits-version.txt)
          LATEST=$(gh release view -R lnbits/lnbits --json tagName -q .tagName)
          echo "pinned=$PINNED latest=$LATEST"
          [ "$PINNED" = "$LATEST" ] && exit 0
          TITLE="LNbits $LATEST released (docs pinned to $PINNED)"
          if gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number' | grep -q .; then exit 0; fi
          gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "LNbits [$LATEST](https://github.com/lnbits/lnbits/releases/tag/$LATEST) is out, and the docs are verified against $PINNED.

          1. Set \`scripts/lnbits-version.txt\` to \`$LATEST\`.
          2. Run the snippet gate and the API claims workflow, and fix any page they flag.
          3. Read the release notes and the commits from $PINNED to $LATEST for behaviour changes the gates can't see (defaults, UI flows). Add them to docs/guides/upgrading.md, and move shipped items out of docs/guides/unreleased.md.
          4. Re-verify the changed pages and set their \`verified_with\` to $LATEST."
